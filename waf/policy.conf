# Loaded AFTER @coraza.conf-recommended and @crs-setup.conf.example,
# BEFORE @owasp_crs/*.conf. No private request/response audit or debug payloads.
SecRuleEngine On
SecRequestBodyAccess On
SecRequestBodyLimit 65536
SecRequestBodyInMemoryLimit 65536
SecRequestBodyLimitAction Reject
SecRequestBodyJsonDepthLimit 32
SecArgumentsLimit 256
SecResponseBodyAccess Off
SecAuditEngine Off
SecDebugLogLevel 0
SecUploadKeepFiles Off

# Explicit PL1 and the standard inbound blocking threshold.
SecAction "id:1100000,phase:1,pass,nolog,setvar:tx.blocking_paranoia_level=1,setvar:tx.detection_paranoia_level=1,setvar:tx.inbound_anomaly_score_threshold=5"

# This API accepts a raw PNG, NOT multipart/form-data. The exception is limited
# to the exact numeric-channel upload path, POST, and image/png content type.
# Binary image contents are validated by the application's image decoder.
SecRule REQUEST_URI "@rx ^/api/channels/[0-9]+/logo(?:\?.*)?$" "id:1100001,phase:1,pass,nolog,chain"
    SecRule REQUEST_METHOD "@streq POST" "chain"
    SecRule REQUEST_HEADERS:Content-Type "@rx (?i)^image/png(?:;[ \t]*.*)?$" "ctl:requestBodyLimit=4194304,setvar:'tx.allowed_request_content_type=|image/png|'"

# Never silently drop excess parsed arguments (including JSON keys). These
# enforcement checks complement the parser's bounded argument collection.
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" "id:1100002,phase:1,deny,status:400,nolog"
SecRule ARGUMENTS_LIMIT_REACHED "@eq 1" "id:1100003,phase:2,deny,status:400,nolog"
