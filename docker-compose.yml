x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *bounded-logs
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neyro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужно задать POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-neyro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neyro} -d ${POSTGRES_DB:-neyro}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: neyro-posting:latest
    restart: unless-stopped
    logging: *bounded-logs
    init: true
    stop_grace_period: 30s
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-neyro}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-neyro}
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *bounded-logs
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?нужно задать SITE_ADDRESS в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  pgdata:
  caddy_data:
  caddy_config:
