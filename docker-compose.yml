x-logging: &bounded-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 384m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      - database
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-neyro}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?нужно задать POSTGRES_PASSWORD в .env}
      POSTGRES_DB: ${POSTGRES_DB:-neyro}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-neyro} -d ${POSTGRES_DB:-neyro}"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: neyro-posting:latest
    restart: unless-stopped
    logging: *bounded-logs
    init: true
    mem_limit: 768m
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      ingress:
        ipv4_address: 172.30.90.3
      database: {}
      app_outbound: {}
    stop_grace_period: 30s
    env_file: .app.env
    environment:
      APP_ENV: production
      # Only Caddy on the dedicated ingress network may supply client addresses.
      FORWARDED_ALLOW_IPS: 172.30.90.2
      DATABASE_URL: postgresql://${APP_DATABASE_USER:?нужна роль приложения}:${APP_DATABASE_PASSWORD:?нужен пароль приложения}@db:5432/${POSTGRES_DB:-neyro}
    volumes:
      - ./data:/app/data
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy

  support:
    image: neyro-posting:latest
    command: ["python", "-m", "app.support"]
    # This worker has no HTTP server; do not inherit the main app's HTTP probe.
    healthcheck:
      disable: true
    restart: unless-stopped
    logging: *bounded-logs
    init: true
    mem_limit: 256m
    pids_limit: 64
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - database
      - support_outbound
    env_file:
      - .app.env
      - .support.env
    environment:
      DATABASE_URL: postgresql://${APP_DATABASE_USER:?нужна роль приложения}:${APP_DATABASE_PASSWORD:?нужен пароль приложения}@db:5432/${POSTGRES_DB:-neyro}
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *bounded-logs
    mem_limit: 192m
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    networks:
      ingress:
        ipv4_address: 172.30.90.2
      proxy_outbound: {}
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?нужно задать SITE_ADDRESS в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

networks:
  ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.90.0/28
  database:
    internal: true
  app_outbound: {}
  support_outbound: {}
  proxy_outbound: {}

volumes:
  pgdata:
  caddy_data:
  caddy_config:
