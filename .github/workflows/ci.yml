name: CI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: neyro
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: neyro_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U neyro -d neyro_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      PYTHON_DOTENV_DISABLED: '1'
      TEST_DATABASE_URL: postgresql://neyro:ci-only-password@127.0.0.1:5432/neyro_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12', cache: pip, cache-dependency-path: requirements.lock}
      - run: python -m pip install -r requirements.lock -r requirements-dev.txt
      - run: python -m pytest -q --junitxml=artifacts/pytest.xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: backend-results, path: artifacts/pytest.xml, retention-days: 7}
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: {node-version: '22', cache: npm}
      - run: npm ci --ignore-scripts
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: {name: ui-screenshots, path: artifacts/ui, retention-days: 7}
  infrastructure:
    name: Infrastructure
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: '3.12'}
      - run: python -m pip install ansible-core==2.19.3 PyYAML==6.0.3
      - run: ansible-galaxy collection install -r infra/ansible/requirements.yml
      - run: python scripts/ci/repository_check.py
      - run: python -m unittest tests.test_release_tooling tests.test_incident_response tests.test_image_transfer -v
      - run: bash -n deploy.sh scripts/deploy/client.sh scripts/resilience/*.sh
      - run: ansible-playbook -i infra/ansible/inventory.yml infra/ansible/site.yml --syntax-check
      - run: ansible-playbook -i infra/ansible/inventory.yml infra/ansible/operations.yml --syntax-check
      - run: ansible-playbook -i infra/ansible/inventory.yml infra/ansible/backup-transfer.yml --syntax-check
      - name: Validate HA playbooks without production credentials
        run: |
          printf '{}\n' > /tmp/neyro-ha-ci-empty.yml
          for playbook in infra/ansible/ha-*.yml infra/ansible/bootstrap-ha.yml; do
            ansible-playbook -i infra/ansible/inventory.yml "$playbook" --syntax-check -e ha_secrets_file=/tmp/neyro-ha-ci-empty.yml
          done
      - run: python scripts/ci/check_infrastructure.py
      - name: Render Kubernetes preparation
        run: kubectl kustomize infra/kubernetes > /tmp/kubernetes.yml
      - name: Validate Kubernetes schemas
        run: |
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o /tmp/kubeconform.tar.gz
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.8.0/CHECKSUMS -o /tmp/kubeconform.checksums
          cd /tmp
          grep ' kubeconform-linux-amd64.tar.gz$' kubeconform.checksums | sed 's/kubeconform-linux-amd64.tar.gz/kubeconform.tar.gz/' | sha256sum -c -
          tar xzf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary -kubernetes-version 1.34.0 /tmp/kubernetes.yml
  container:
    name: Container
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: {persist-credentials: false}
      - run: docker build --pull -t neyro-posting:ci .
      - name: Verify runtime without workers or secrets
        run: |
          docker run --rm --network none --entrypoint python neyro-posting:ci -c 'import os,asyncpg,fastapi,aiogram; assert os.getuid() == 10001'
          docker run --rm --network none --entrypoint python neyro-posting:ci -m pip inspect > /tmp/runtime-sbom.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: {name: runtime-package-inventory, path: /tmp/runtime-sbom.json, retention-days: 30}
