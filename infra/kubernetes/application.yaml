# Prepared for a future migration. Remains scaled to zero until fencing/data restore.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: neyro
  namespace: neyro
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neyro
spec:
  replicas: 0
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: neyro
  template:
    metadata:
      labels:
        app: neyro
    spec:
      serviceAccountName: neyro
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: app
          # Replace with a verified image digest available to the future cluster.
          image: neyro-posting:migration-required
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: neyro-config
            - secretRef:
                name: neyro-runtime
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              cpu: '1'
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: neyro-data
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: neyro
spec:
  type: ClusterIP
  selector:
    app: neyro
  ports:
    - name: http
      port: 8080
      targetPort: http
